name: Dependency Security CI

on:
  pull_request:
    paths:
      - "engine/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/engine-security-ci.yml"
  push:
    branches:
      - main
      - test-good-try
    paths:
      - "engine/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/engine-security-ci.yml"

permissions:
  contents: read

jobs:
  dependency-security-engine:
    name: Engine Lock + Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            engine/requirements.in
            engine/requirements.txt
            engine/requirements-security.in
            engine/requirements-security.txt

      - name: Pin pip tooling (pip/pip-tools)
        run: |
          python -m pip install --upgrade "pip==25.1.1" "setuptools==83.0.0" "wheel==0.47.0"
          python -m pip install --upgrade "pip-tools==7.5.3"
          python -m pip --version
          pip-compile --version
          pip-sync --version

      - name: Install Security Tooling
        run: python -m pip install --require-hashes -r engine/requirements-security.txt

      - name: Enforce Hash-Verified Install
        run: python -m pip install --require-hashes --no-deps -r engine/requirements.txt

      - name: Engine Dependency Vulnerability Audit
        # GHSA-rrmf-rvhw-rf47 / CVE-2025-3000 affects legacy torch.jit.script.
        # Remove this exception when PyTorch publishes a stable fixed release.
        run: python -m pip_audit --disable-pip -r engine/requirements.txt --ignore-vuln GHSA-rrmf-rvhw-rf47 --ignore-vuln CVE-2025-3000

  dependency-security-app:
    name: Backend/Frontend Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock.in
            backend/requirements.lock.txt
            frontend/requirements.lock.in
            frontend/requirements.lock.txt

      - name: Install audit tool
        run: python -m pip install --upgrade "pip==25.1.1" "pip-audit==2.9.0"

      - name: Enforce Hash-Verified Backend Install
        run: python -m pip install --require-hashes --no-deps -r backend/requirements.lock.txt

      - name: Enforce Hash-Verified Frontend Install
        run: python -m pip install --require-hashes --no-deps -r frontend/requirements.lock.txt

      - name: Backend Dependency Vulnerability Audit
        # GHSA-rrmf-rvhw-rf47 / CVE-2025-3000 affects legacy torch.jit.script.
        # Remove this exception when PyTorch publishes a stable fixed release.
        run: python -m pip_audit --disable-pip -r backend/requirements.lock.txt --ignore-vuln GHSA-rrmf-rvhw-rf47 --ignore-vuln CVE-2025-3000

      - name: Frontend Dependency Vulnerability Audit
        run: python -m pip_audit --disable-pip -r frontend/requirements.lock.txt
