name: Core Quality CI

on:
  pull_request:
  push:
    branches:
      - main
      - test-good-try

permissions:
  contents: read

jobs:
  unit-and-integration:
    name: Unit + API Integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/tests/requirements-core.txt
      - name: Install maintained test dependencies
        run: python -m pip install -r backend/tests/requirements-core.txt
      - name: Unit tests
        run: >-
          python -m pytest
          engine/tests/test_quiz_modes.py
          engine/tests/test_checkpoint_normalization.py
          backend/tests/test_auth_api.py
          backend/tests/test_stateless_storage.py
          -q
      - name: API and integration tests
        run: >-
          python -m pytest
          backend/tests/test_sync_api.py
          backend/tests/test_workspace_api.py
          backend/tests/test_stream_and_routes.py
          backend/tests/test_lesson_materials.py
          -q

  browser-runtime:
    name: Chromium Browser Runtime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/tests/requirements-core.txt
            backend/tests/requirements-test.in
      - name: Install application and browser-test dependencies
        run: >-
          python -m pip install
          -r backend/tests/requirements-core.txt
          -r backend/tests/requirements-test.in
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run browser-runtime tests
        run: python -m pytest backend/tests/test_browser_js.py -q

  frontend-build:
    name: TypeScript + Production Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from lockfile
        working-directory: frontend
        run: npm ci
      - name: Compile and build
        working-directory: frontend
        run: npm run build
